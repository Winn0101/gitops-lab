apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: secrets-dev
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/Winn0101/gitops-lab.git
    targetRevision: HEAD
    path: secrets/dev
  destination:
    server: https://kubernetes.default.svc
    namespace: webapp-dev
  syncPolicy:
    automated:
      prune: confirm
      selfHeal: true
