apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: webapp-staging
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/Winn0101/gitops-lab.git
    targetRevision: HEAD
    path: charts/webapp
    helm:
      valueFiles:
        - ../../environments/staging/values.yaml
  destination:
    server: https://kubernetes.default.svc
    namespace: webapp-staging
  syncPolicy:
    automated:
      prune: confirm
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
